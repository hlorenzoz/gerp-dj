<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GERP DJ — Dossier de prensa</title>
<!-- Source of the press kit PDF. Render with ?lang=es|gl and print to A4 landscape (see design/DESIGN.md). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root {
    --ground: #07070a; --surface: #131318;
    --ink: #f3f2ee; --muted: #a9a8a3; --acid: #dcff3c;
    --pad: 14mm;
  }
  @page { size: A4 landscape; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--ground); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  body { font-family: "Archivo", system-ui, sans-serif; color: var(--ink); font-size: 11.5pt; line-height: 1.5; }
  .page { position: relative; width: 297mm; height: 210mm; overflow: hidden; background: var(--ground); break-after: page; padding: var(--pad); }
  .display { font-stretch: 125%; font-weight: 850; letter-spacing: -0.035em; line-height: 0.9; }
  h2.display { font-size: 21mm; }
  .muted { color: var(--muted); }
  .acid { color: var(--acid); }
  .grid { display: grid; grid-template-columns: repeat(12, 1fr); column-gap: 8mm; height: 100%; }
  .photo { width: 100%; height: 100%; object-fit: cover; border-radius: 6mm; display: block; }
  .panel { background: var(--surface); border-radius: 6mm; padding: 7mm; }
  .foot { position: absolute; left: var(--pad); right: var(--pad); bottom: 7mm; display: flex; justify-content: space-between; font-size: 8.5pt; color: var(--muted); }
  .lede { font-size: 14pt; line-height: 1.45; }
  p + p { margin-top: 3.5mm; }
  ul.rows { list-style: none; display: grid; gap: 3mm; }
  ul.rows li { background: var(--surface); border-radius: 4mm; padding: 4.5mm 5.5mm; }
  ul.rows b { display: block; font-size: 13pt; }

  .cover { padding: 0; display: grid; grid-template-columns: 58% 42%; }
  .cover .left { padding: var(--pad); display: flex; flex-direction: column; justify-content: space-between; }
  .cover h1 { font-size: 30mm; }
  .cover img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; display: block; }
  .tag { display: inline-block; background: var(--acid); color: var(--ground); font-weight: 700; border-radius: 99px; padding: 2mm 5mm; }

  .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; margin-top: 8mm; }
  .facts div { background: var(--surface); border-radius: 4mm; padding: 4mm; }
  .facts dt { color: var(--muted); font-size: 9.5pt; }
  .facts dd { font-weight: 700; font-size: 12pt; line-height: 1.25; margin-top: 1mm; }

  .kit { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; margin-top: 9mm; }
  .kit li { background: var(--surface); border-radius: 4mm; padding: 4.5mm 5mm; font-weight: 700; }

  .action { display: grid; grid-template-columns: 2fr 1fr; grid-template-rows: 1fr 1fr; gap: 5mm; height: 128mm; margin-top: 8mm; }
  .action figure { position: relative; }
  .action figure:first-child { grid-row: span 2; }
  .action figcaption { position: absolute; left: 4mm; bottom: 4mm; background: rgb(7 7 10 / 0.72); border-radius: 3mm; padding: 2mm 3.5mm; font-weight: 700; font-size: 10pt; }

  .needs { display: grid; grid-template-columns: 1fr 1fr; gap: 6mm; margin-top: 9mm; }
  .needs h3 { font-size: 14pt; margin-bottom: 3mm; color: var(--acid); }
  .needs ul { padding-left: 4.5mm; }
  .needs li + li { margin-top: 2.2mm; }

  .wa { font-size: 15mm; }
  .qr { background: var(--ink); border-radius: 6mm; padding: 7mm; width: 78mm; }
  .qr svg { width: 100%; height: auto; display: block; }
  a { color: inherit; text-decoration: none; }
</style>
</head>
<body>
<main id="doc"></main>
<script>
const lang = new URLSearchParams(location.search).get('lang') === 'gl' ? 'gl' : 'es';
document.documentElement.lang = lang;
const WA_NUMBER = '34613340500';
const WA_DISPLAY = '+34 613 34 05 00';
// JPEG copies made by scripts/media-masters.sh: Chrome embeds JPEG as-is, so the PDF stays small.
const IMG = name => `img/${name}.jpg`;

const T = {
  es: {
    doc: 'Dossier de prensa', role: 'DJ para fiestas, bodas y eventos · Ourense, Galicia', hello: 'Hola, quiero contratar a GERP DJ.',
    bioH: 'Bio',
    bio: [
      'GERP DJ pone la música y las luces en fiestas, bodas y celebraciones de Ourense y de toda Galicia, y anima la noche micrófono en mano.',
      'Trabaja con su propio equipo: cabina con su nombre, altavoces, iluminación LED y una controladora Denon DJ. Lo monta igual en la plaza de una aldea, en una terraza o en un salón.',
      '[Pendiente: la historia de GERP DJ, sus años de experiencia y cómo empezó]',
    ],
    facts: [['Base', 'Ourense'], ['Equipo', 'Sonido y luces propios'], ['Zona', 'Ourense y toda Galicia']],
    svcH: 'Servicios',
    services: [
      ['Fiestas populares', 'Verbenas y fiestas de aldea con cabina, sonido y luces propios.'],
      ['Bodas', 'Del cóctel al último baile, con la música que elijáis juntos.'],
      ['Fiestas privadas', 'Cumpleaños, aniversarios y celebraciones en casa, en terraza o en sala.'],
      ['Eventos de empresa', 'Cenas, presentaciones y fiestas de fin de año.'],
    ],
    kitH: 'Equipo propio',
    kit: ['Cabina GERP DJ', 'Equipo de sonido completo', 'Iluminación LED y efectos de luz', 'Micrófono para dedicatorias y anuncios', 'Controladora Denon DJ'],
    actionH: 'En acción', actionP: 'Música, luces y micrófono en mano: así suena una noche con GERP DJ.',
    caps: ['Fiesta de aldea', 'Sesión en terraza', 'Luces en directo'],
    pressH: 'Prensa', pressP: '[Pendiente: citas de prensa reales con medio y fecha]',
    needsH: 'Qué incluye',
    brings: ['Lo que aporta GERP DJ', ['Cabina, sonido e iluminación', 'Micrófono para dedicatorias y anuncios', 'Música adaptada a cada momento de la fiesta', 'Montaje y desmontaje del equipo']],
    needs: ['Lo que necesitamos en el lugar', ['Toma de corriente de 230 V junto a la cabina', 'Espacio para la cabina (unos 2 × 1 m)', 'Acceso 60 minutos antes para montar y probar', 'Zona cubierta si la fiesta es al aire libre']],
    needsNote: '[Ejemplo: confirmar cada punto con GERP DJ antes de publicar]',
    contactH: 'Contratación', contactP: 'Toda la comunicación y las reservas se gestionan por WhatsApp Business. Respuesta en 48 horas laborables.',
    qrNote: 'Escanea el código para abrir el chat', channel: 'Canal de WhatsApp: [URL del canal]', web: 'Web: [dominio]', page: 'Página',
  },
  gl: {
    doc: 'Dossier de prensa', role: 'DJ para festas, vodas e eventos · Ourense, Galicia', hello: 'Ola, quero contratar a GERP DJ.',
    bioH: 'Bio',
    bio: [
      'GERP DJ pon a música e as luces en festas, vodas e celebracións de Ourense e de toda Galicia, e anima a noite micrófono na man.',
      'Traballa co seu propio equipo: cabina co seu nome, altofalantes, iluminación LED e unha controladora Denon DJ. Móntao igual na praza dunha aldea, nunha terraza ou nun salón.',
      '[Pendente: a historia de GERP DJ, os seus anos de experiencia e como comezou]',
    ],
    facts: [['Base', 'Ourense'], ['Equipo', 'Son e luces propios'], ['Zona', 'Ourense e toda Galicia']],
    svcH: 'Servizos',
    services: [
      ['Festas populares', 'Verbenas e festas de aldea con cabina, son e luces propios.'],
      ['Vodas', 'Do cóctel ao último baile, coa música que escollades xuntos.'],
      ['Festas privadas', 'Aniversarios e celebracións na casa, nunha terraza ou nunha sala.'],
      ['Eventos de empresa', 'Ceas, presentacións e festas de fin de ano.'],
    ],
    kitH: 'Equipo propio',
    kit: ['Cabina GERP DJ', 'Equipo de son completo', 'Iluminación LED e efectos de luz', 'Micrófono para dedicatorias e anuncios', 'Controladora Denon DJ'],
    actionH: 'En acción', actionP: 'Música, luces e micrófono na man: así soa unha noite con GERP DJ.',
    caps: ['Festa de aldea', 'Sesión en terraza', 'Luces en directo'],
    pressH: 'Prensa', pressP: '[Pendente: citas de prensa reais con medio e data]',
    needsH: 'Que inclúe',
    brings: ['O que achega GERP DJ', ['Cabina, son e iluminación', 'Micrófono para dedicatorias e anuncios', 'Música adaptada a cada momento da festa', 'Montaxe e desmontaxe do equipo']],
    needs: ['O que precisamos no lugar', ['Toma de corrente de 230 V xunto á cabina', 'Espazo para a cabina (uns 2 × 1 m)', 'Acceso 60 minutos antes para montar e probar', 'Zona cuberta se a festa é ao aire libre']],
    needsNote: '[Exemplo: confirmar cada punto con GERP DJ antes de publicar]',
    contactH: 'Contratación', contactP: 'Toda a comunicación e as reservas xestiónanse por WhatsApp Business. Resposta en 48 horas laborables.',
    qrNote: 'Escanea o código para abrir o chat', channel: 'Canle de WhatsApp: [URL da canle]', web: 'Web: [dominio]', page: 'Páxina',
  },
}[lang];

const waUrl = `https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(T.hello)}`;
const TOTAL = 6;
const foot = n => `<div class="foot"><span>GERP DJ · ${T.doc} 2026</span><span>${T.page} ${n} / ${TOTAL}</span></div>`;
const qr = qrcode(0, 'M'); qr.addData(waUrl); qr.make();

document.getElementById('doc').innerHTML = `
<section class="page cover">
  <div class="left">
    <div><span class="tag">${T.doc} 2026</span></div>
    <div>
      <h1 class="display">GERP DJ</h1>
      <p class="lede" style="margin-top:7mm;font-size:16pt;max-width:140mm">${T.role}</p>
    </div>
  </div>
  <img src="${IMG('gerp-dj-ourense-cabina-iluminacion-led')}" alt="">
</section>

<section class="page">
  <div class="grid" style="padding-bottom:8mm">
    <div style="grid-column:span 7">
      <h2 class="display">${T.bioH}</h2>
      <div style="margin-top:9mm">${T.bio.map((p, i) => `<p class="${i === 0 ? 'lede' : ''} ${i === 2 ? 'muted' : ''}">${p}</p>`).join('')}</div>
      <dl class="facts">${T.facts.map(([k, v]) => `<div><dt>${k}</dt><dd>${v}</dd></div>`).join('')}</dl>
    </div>
    <div style="grid-column:8 / span 5"><img class="photo" style="object-position:50% 15%" src="${IMG('gerp-dj-ourense-retrato-equipo-sonido')}" alt=""></div>
  </div>
  ${foot(2)}
</section>

<section class="page">
  <div class="grid" style="padding-bottom:8mm">
    <div style="grid-column:span 6">
      <h2 class="display">${T.svcH}</h2>
      <ul class="rows" style="margin-top:9mm">${T.services.map(([t, d]) => `<li><b>${t}</b><span class="muted">${d}</span></li>`).join('')}</ul>
    </div>
    <div style="grid-column:7 / span 6;display:flex;flex-direction:column;min-height:0">
      <h2 class="display">${T.kitH}</h2>
      <ul class="kit">${T.kit.map(k => `<li>${k}</li>`).join('')}</ul>
      <img class="photo" style="margin-top:5mm;height:auto;min-height:0;flex:1 1 0;object-position:50% 45%" src="${IMG('gerp-dj-ourense-controladora-denon-dj')}" alt="">
    </div>
  </div>
  ${foot(3)}
</section>

<section class="page">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:10mm">
    <h2 class="display">${T.actionH}</h2>
    <p class="lede" style="max-width:110mm">${T.actionP}</p>
  </div>
  <div class="action">
    <figure><img class="photo" src="${IMG('gerp-dj-fiesta-aldea-ourense')}" alt=""><figcaption>${T.caps[0]}</figcaption></figure>
    <figure><img class="photo" src="${IMG('gerp-dj-sesion-terraza-ourense')}" alt=""><figcaption>${T.caps[1]}</figcaption></figure>
    <figure><img class="photo" src="${IMG('gerp-dj-luces-fiesta-ourense')}" alt=""><figcaption>${T.caps[2]}</figcaption></figure>
  </div>
  <p class="muted" style="margin-top:4mm"><b style="color:var(--ink)">${T.pressH}:</b> ${T.pressP}</p>
  ${foot(4)}
</section>

<section class="page">
  <h2 class="display">${T.needsH}</h2>
  <div class="needs">${[T.brings, T.needs].map(([h, items]) => `<div class="panel"><h3>${h}</h3><ul>${items.map(i => `<li>${i}</li>`).join('')}</ul></div>`).join('')}</div>
  <p class="muted" style="margin-top:6mm">${T.needsNote}</p>
  <img src="${IMG('gerp-dj-fiesta-aldea-ourense')}" alt="" style="position:absolute;left:var(--pad);right:var(--pad);bottom:16mm;height:62mm;width:calc(100% - 2 * var(--pad));object-fit:cover;object-position:50% 70%;border-radius:6mm">
  ${foot(5)}
</section>

<section class="page">
  <div class="grid" style="padding-bottom:8mm">
    <div style="grid-column:span 7;display:flex;flex-direction:column">
      <h2 class="display">${T.contactH}</h2>
      <p class="lede" style="margin-top:7mm;max-width:150mm">${T.contactP}</p>
      <p style="margin-top:9mm;font-weight:700">WhatsApp Business</p>
      <a href="${waUrl}" class="display acid wa" style="margin-top:2mm">${WA_DISPLAY}</a>
      <p style="margin-top:8mm">${T.channel}</p>
      <p>${T.web}</p>
    </div>
    <div style="grid-column:9 / span 4;display:flex;flex-direction:column;justify-content:center;align-items:flex-end">
      <a href="${waUrl}" class="qr">${qr.createSvgTag({ cellSize: 4, margin: 0, scalable: true })}</a>
      <p class="muted" style="margin-top:4mm;width:78mm;text-align:center">${T.qrNote}</p>
    </div>
  </div>
  ${foot(6)}
</section>`;
</script>
</body>
</html>
